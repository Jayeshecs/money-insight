<main id="main" class="product">
  <!-- Hero Section -->
  <section class="hero section">
    <div class="container">
      <h1>MoneyInsight</h1>
      <p class="subtitle">{{ content.product.overview }}</p>
      <app-cta-button
        text="Launch MoneyInsight"
        [href]="content.product.moneyInsightUrl"
        [external]="true"
        variant="primary"
        size="large">
      </app-cta-button>
    </div>
  </section>

  <!-- Features Section -->
  <section class="features section">
    <div class="container">
      <h2 class="section-title text-center">Powerful Features</h2>
      <div class="grid cols-3">
        <div *ngFor="let feature of content.product.features" class="feature-card card">
          <div class="feature-icon">
            <svg *ngIf="feature.icon === 'upload'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <svg *ngIf="feature.icon === 'tag'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
              <line x1="7" y1="7" x2="7.01" y2="7"></line>
            </svg>
            <svg *ngIf="feature.icon === 'bar-chart'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="20" x2="12" y2="10"></line>
              <line x1="18" y1="20" x2="18" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="16"></line>
            </svg>
            <svg *ngIf="feature.icon === 'lock'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <svg *ngIf="feature.icon === 'cloud'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
            </svg>
            <svg *ngIf="feature.icon === 'wifi-off'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="1" y1="1" x2="23" y2="23"></line>
              <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
              <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
              <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
              <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
              <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
              <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
          </div>
          <h3 class="feature-title">{{ feature.title }}</h3>
          <p class="feature-description">{{ feature.description }}</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Use Cases Section -->
  <section class="use-cases section">
    <div class="container">
      <h2 class="section-title text-center">What Can You Do?</h2>
      <div class="grid cols-2">
        <div *ngFor="let useCase of content.product.useCases" class="use-case-card card">
          <h3>{{ useCase.title }}</h3>
          <p>{{ useCase.description }}</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Pricing Section -->
  <section class="pricing section">
    <div class="container">
      <h2 class="section-title text-center">Pricing</h2>
      <div class="pricing-card">
        <h3>Beta Access</h3>
        <p class="price">Free</p>
        <p class="pricing-details">{{ content.product.pricing }}</p>
        <app-cta-button
          text="Get Started"
          [href]="content.product.moneyInsightUrl"
          [external]="true"
          variant="primary"
          size="large">
        </app-cta-button>
      </div>
    </div>
  </section>
</main>
